; PlatformIO Project Configuration File
;
; PixelLink firmware - recibe frames RGB 96x24 por Bluetooth (HC-05/06)
; y los muestra en una matriz WS2812 (NeoPixel) de 96x24 = 2304 LEDs.

[platformio]
default_envs = uno

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_port = COM3
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; upload_port se autodetecta: PlatformIO busca el primer puerto con un UNO.
; Si tienes varios dispositivos USB y se equivoca, descomenta la línea y
; pon el puerto real (mira PIO Home → Devices para verlo).
; upload_port = COM5
monitor_speed = 9600
upload_flags = -V
lib_deps =
    majicdesigns/MD_MAX72XX@^3.5.1
    majicdesigns/MD_Parola@^3.7.3
